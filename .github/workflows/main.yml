# Install Python dependencies, run tests, and lint with a single version of Python.
# See https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: HLS LPDAAC Notifications

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches:
      - main
    tags-ignore:
      - '*'
    paths:
      - '.github/workflows/*'
      - '.python-version'
      - 'cdk/**'
      - 'src/**'
      - 'cdk.json'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
    branches:
      - main
    paths:
      - '.github/workflows/*'
      - '.python-version'
      - 'cdk/**'
      - 'src/**'
      - 'cdk.json'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'

# See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#updating-your-github-actions-workflow
permissions:
  id-token: write # required for requesting the JWT
  contents: read  # required for actions/checkout

defaults:
  run:
    shell: bash

env:
  # Fail rather than silently re-resolving if uv.lock is out of date.
  UV_LOCKED: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install
      - name: Run lint, type checks and unit tests
        run: make check

  integration-tests:
    runs-on: ubuntu-latest
    environment: dev-forward
    # The integration test stacks and resources are constant, so we can't
    # have >1 integration test running at the same time. Queue instead of
    # cancel.
    concurrency:
      group: integration-test-stacks
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: ${{ github.actor }}
      - name: Convert vars to environment variables
        shell: python
        run: |
          import os

          deploy_vars = ${{ toJson(vars) }}

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in deploy_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)
      - name: Deploy forward notification integration test stack
        run: |
          make deploy-forward-it
      - name: Run forward notification integration tests
        run: |
          make forward-integration-tests
      - name: Destroy forward notification integration test stack
        if: '!cancelled()'
        run: |
          make destroy-forward-it

  deploy-dev:
    # Deploy to Dev only on push (including merged PR) to `main` branch
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    needs:
      - unit-tests
      - integration-tests
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev-forward
      target: forward
    secrets: inherit

  deploy-prod:
    # Deploy to Prod only on publishing a release (tag) on `main` branch
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - unit-tests
      - integration-tests
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod-forward
      target: forward
    secrets: inherit

  deploy-dev-historical:
    # Deploy to Dev only on push (including merged PR) to `main` branch
    if: github.event_name == 'push' && github.event.ref == 'refs/heads/main'
    needs:
      - unit-tests
      - integration-tests
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev-historical
      target: historical
    secrets: inherit

  deploy-prod-historical:
    # Deploy to Prod only on publishing a release (tag) on `main` branch
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - unit-tests
      - integration-tests
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod-historical
      target: historical
    secrets: inherit

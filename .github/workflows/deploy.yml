name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub environment
        required: true
        type: choice
        options:
          - dev-forward
          - prod-forward
          - dev-historical
          - prod-historical
      target:
        description: CDK app to deploy (must match the environment suffix)
        required: true
        type: choice
        options:
          - forward
          - historical
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target:
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  # Fail rather than silently re-resolving if uv.lock is out of date.
  UV_LOCKED: "1"

# See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#updating-your-github-actions-workflow
permissions:
  id-token: write # required for requesting the JWT
  contents: read  # required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Check the target matches the environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "${ENVIRONMENT}" != *"-${TARGET}" ]]; then
            echo "Environment '${ENVIRONMENT}' does not match target '${TARGET}'" >&2
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: ${{ github.actor }}
      - name: Convert vars to environment variables
        shell: python
        run: |
          import os

          deploy_vars = ${{ toJson(vars) }}

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in deploy_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)
      - name: Deploy ${{ inputs.target }} notification to ${{ inputs.environment }}
        env:
          HLS_LPDAAC_SLACK_ALERT_WEBHOOK: ${{ secrets.HLS_LPDAAC_SLACK_ALERT_WEBHOOK }}
        run: |
          echo "Notification delivery paused: ${HLS_LPDAAC_PAUSED:-false}" | tee -a "$GITHUB_STEP_SUMMARY"
          make deploy-${{ inputs.target }}

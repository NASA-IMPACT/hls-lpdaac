[project]
name = "hls-lpdaac"
version = "1.1"
description = "Forward HLS S3 object-created notifications to LPDAAC"
readme = "README.md"
# Upper bound tracks the Lambda runtime the handlers are deployed on.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Development Seed" }]
dependencies = []

[dependency-groups]
test = [
  "aws-cdk-lib>=2.100.0",
  "boto3~=1.34",
  "constructs>=10.0.0",
  "hls_manifest @ https://github.com/NASA-IMPACT/hls-manifest/releases/download/v2.6/hls_manifest-2.6-py3-none-any.whl",
  "moto[s3,sqs,ssm]~=5.0",
  "pytest~=8.0",
  "pytest-cov~=4.1",
]
dev = [
  { include-group = "test" },
  "aws_lambda_typing~=2.18",
  "boto3-stubs[iam,lambda,s3,sqs,ssm]~=1.34",
  "botocore-stubs~=1.34",
  "mypy~=1.8",
  "nodeenv~=1.8",
  "pre-commit~=3.6",
  "pre-commit-hooks~=4.5",
  "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hls_lpdaac"
module-root = "src"

[tool.ruff]
line-length = 90
extend-exclude = ["cdk.out"]
# `cdk` is a source root because the CDK CLI runs `cdk/app_*.py` as scripts, so
# they import `stacks` rather than `cdk.stacks`.
src = [".", "cdk", "src"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "W"]
# Line length is enforced by the formatter, which leaves long strings/comments alone.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
filterwarnings = ["ignore::FutureWarning"]
testpaths = ["tests"]
